<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Abdul Latif Jameel Hospital</title>
  <!-- Any mistyped or old address lands on the links page instead of an error. -->
  <script>
    (function () {
      var p = location.pathname, i = p.indexOf("/", 1);
      // On USERNAME.github.io/links/... keep the "/links/" part; on a custom domain go to "/".
      var root = /\.github\.io$/.test(location.hostname) && i > 0 ? p.slice(0, i + 1) : "/";
      location.replace(root);
    })();
  </script>
</head>
<body><p><a href="/">Abdul Latif Jameel Hospital</a></p></body>
</html>
